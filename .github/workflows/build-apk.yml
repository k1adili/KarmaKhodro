name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تنظیم Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: بررسی وجود فایل‌های فونت Vazirmatn
        run: |
          FONT_DIR="app/src/main/res/font"
          MISSING=0
          for f in vazirmatn_regular.ttf vazirmatn_medium.ttf vazirmatn_bold.ttf; do
            if [ ! -f "$FONT_DIR/$f" ]; then
              echo "::error::فایل فونت پیدا نشد: $FONT_DIR/$f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "لطفاً فایل‌های فونت Vazirmatn را طبق راهنمای app/src/main/res/font/README.md اضافه کنید."
            exit 1
          fi

      - name: ساخت APK نسخه Debug (قابل نصب مستقیم)
        run: gradle assembleDebug --stacktrace

      - name: ساخت APK نسخه Release (بدون امضا)
        run: gradle assembleRelease --stacktrace

      - name: آپلود APK به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarmaKhodro-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
